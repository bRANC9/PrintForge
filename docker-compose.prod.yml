# PrintForge – production / pull-based stack (TrueNAS SCALE, or any host that
# already runs Watchtower).
#
#   External Ollama:  docker compose -f docker-compose.prod.yml up -d
#   Internal Ollama:  docker compose -f docker-compose.prod.yml -f docker-compose.ollama.yml up -d
#
# REQUIRED in .env before the first `up` (this file ships no production secrets):
#   DJANGO_SECRET_KEY            long random string
#   POSTGRES_PASSWORD            strong password
#   DJANGO_ALLOWED_HOSTS         NAS hostname/IP, comma-separated
#   DJANGO_CSRF_TRUSTED_ORIGINS  https://<your-domain> when behind TLS
#
# The file still resolves without a .env (safe, non-secret defaults) so CI can
# run `docker compose config`; those defaults are NOT safe for production.
#
# Same services, ports and env as docker-compose.yml, but web/worker are PULLED
# from GHCR instead of built locally, and carry the Watchtower enable label so
# the already-running Watchtower recreates them when a new :latest is published.
#
# Rollback / pinning: set PRINTFORGE_IMAGE in .env, e.g.
#   PRINTFORGE_IMAGE=ghcr.io/branc9/printforge:sha-1a2b3c4
# Watchtower follows the image reference, so a pinned tag is not auto-updated.
#
# Requires the repo's ./docker/db/init (pgvector extension) next to this file.

name: printforge

x-app-env: &app-env
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    # HTTPS / reverse-proxy hardening. All off by default; enable them only when
    # TLS actually terminates in front of the app (see docs/truenas-deploy.md).
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
    DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
    DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
    DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
    DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-false}
    DATABASE_URL: ${DATABASE_URL:-postgres://printforge:printforge@db:5432/printforge}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-coder:30b}
    # Optional vision model for the agent self-check review; empty = use OLLAMA_MODEL.
    OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
    # LLM provider: "ollama" (default) or "openai" for any OpenAI-compatible
    # endpoint (hosted OpenAI or a local gateway). OPENAI_* are only used then.
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    RAG_ENABLED: ${RAG_ENABLED:-false}
    # Web search for the Research agent. Empty SEARCH_BACKEND disables it;
    # docker-compose.search.yml adds a self-hosted SearXNG and points this here.
    SEARCH_BACKEND: ${SEARCH_BACKEND:-}
    SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
    # Storage: "local" (default) or "s3" (S3/MinIO; requires the AWS_* vars).
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    MEDIA_ROOT: /data/media
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
    # Gunicorn tuning for the `web` service (ignored by the celery `worker`).
    # Lower GUNICORN_WORKERS on a small NAS; see docs/truenas-deploy.md.
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-gthread}
    GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
    GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    GUNICORN_ACCESS_LOG: ${GUNICORN_ACCESS_LOG:-false}
    GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    # CAD / slicing sandbox (Docker-out-of-Docker). The worker launches one
    # ephemeral sandbox container per job; the images are pulled on demand.
    OPENSCAD_MODE: ${OPENSCAD_MODE:-docker}
    OPENSCAD_IMAGE: ${OPENSCAD_IMAGE:-ghcr.io/branc9/printforge-openscad:latest}
    SLICER_MODE: ${SLICER_MODE:-docker}
    # Active slicer backend: prusaslicer (default) or orca (alias orcaslicer).
    SLICER_BACKEND: ${SLICER_BACKEND:-prusaslicer}
    # Per-backend sandbox images. Each backend reads its own alias, but
    # SLICER_IMAGE — a deployment-wide override — wins for whichever backend is
    # active, so it is left unset by default. Switching backend only needs
    # SLICER_BACKEND=orca: ORCASLICER_IMAGE already points at the Orca image.
    SLICER_IMAGE: ${SLICER_IMAGE:-}
    PRUSASLICER_IMAGE: ${PRUSASLICER_IMAGE:-ghcr.io/branc9/printforge-prusaslicer:latest}
    ORCASLICER_IMAGE: ${ORCASLICER_IMAGE:-ghcr.io/branc9/printforge-orcaslicer:latest}

services:
    db:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-printforge}
            POSTGRES_USER: ${POSTGRES_USER:-printforge}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printforge}
        volumes:
            - ${DATA_ROOT:-./data}/pg:/var/lib/postgresql/data
            - ./docker/db/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-printforge} -d ${POSTGRES_DB:-printforge}",
                ]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - ${DATA_ROOT:-./data}/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    web:
        image: ${PRINTFORGE_IMAGE:-ghcr.io/branc9/printforge:latest}
        pull_policy: always
        command: ["/app/docker/django/entrypoint.sh", "web"]
        environment: *app-env
        volumes:
            - ${DATA_ROOT:-./data}/media:/data/media
        ports:
            - "${WEB_PORT:-8080}:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\"",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        labels:
            com.centurylinklabs.watchtower.enable: "true"
        restart: unless-stopped

    worker:
        image: ${PRINTFORGE_IMAGE:-ghcr.io/branc9/printforge:latest}
        pull_policy: always
        command: ["/app/docker/django/entrypoint.sh", "worker"]
        environment:
            <<: *app-env
            # Docker-out-of-Docker: the host daemon resolves the sandbox -v
            # source paths on the HOST, so the worker's scratch dir must be
            # mounted at the identical absolute path (see the volume below).
            # tempfile (job dirs) honours TMPDIR. Set SANDBOX_WORK_DIR to a pool
            # dataset path on TrueNAS, e.g. /mnt/<pool>/apps/printforge/scratch.
            TMPDIR: ${SANDBOX_WORK_DIR:-/data/scratch}
        volumes:
            - ${DATA_ROOT:-./data}/media:/data/media
            # Docker-out-of-Docker scratch: identical path on both sides, so the
            # sandbox launched via the socket can see the worker's job dirs.
            - ${SANDBOX_WORK_DIR:-/data/scratch}:${SANDBOX_WORK_DIR:-/data/scratch}
            # SECURITY: mounting the Docker socket gives this container control of
            # the host Docker daemon (Docker-out-of-Docker). It is REQUIRED so the
            # CAD/slicer workers can launch ephemeral sandbox containers, and it is
            # the main security trade-off of this deployment: any process in this
            # container can start/stop/inspect ANY container on the host.
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        labels:
            com.centurylinklabs.watchtower.enable: "true"
        restart: unless-stopped
