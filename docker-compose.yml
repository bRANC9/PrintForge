# PrintForge – base stack (Ollama is NOT included; use docker-compose.ollama.yml
# to run Ollama as an internal service).
#
#   External Ollama:  docker compose up -d
#   Internal Ollama:  docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# On TrueNAS SCALE set DATA_ROOT=/mnt/<pool>/apps/printforge in .env.

name: printforge

x-app-env: &app-env
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: ${DATABASE_URL:-postgres://printforge:printforge@db:5432/printforge}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-coder:30b}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    RAG_ENABLED: ${RAG_ENABLED:-false}
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    MEDIA_ROOT: /data/media
    # Gunicorn tuning for the `web` service (ignored by the celery `worker`).
    # See docs/truenas-deploy.md if workers time out.
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-gthread}
    GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
    GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    GUNICORN_ACCESS_LOG: ${GUNICORN_ACCESS_LOG:-false}
    GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}

services:
    db:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-printforge}
            POSTGRES_USER: ${POSTGRES_USER:-printforge}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printforge}
        volumes:
            - ${DATA_ROOT:-./data}/pg:/var/lib/postgresql/data
            - ./docker/db/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-printforge} -d ${POSTGRES_DB:-printforge}",
                ]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - ${DATA_ROOT:-./data}/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: docker/django/Dockerfile
        command: ["/app/docker/django/entrypoint.sh", "web"]
        environment: *app-env
        volumes:
            - ${DATA_ROOT:-./data}/media:/data/media
        ports:
            - "${WEB_PORT:-8080}:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\"",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: docker/django/Dockerfile
        command: ["/app/docker/django/entrypoint.sh", "worker"]
        environment: *app-env
        volumes:
            - ${DATA_ROOT:-./data}/media:/data/media
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
