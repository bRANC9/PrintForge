[project]
name = "printforge-backend"
version = "0.1.0"
description = "PrintForge – self-hosted AI 3D print hub (backend)"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pgvector>=0.3",
    "trimesh>=4.5",
    "pillow>=11.0",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "djlint>=1.35",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "../tests"]
testpaths = ["../tests", "."]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["F403", "F405"]
"tests/**" = ["S101"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
preserve_blank_lines = true
blank_line_after_tag = "load,extends"
format_attribute_template_tags = true
