name: Release

# Builds the Django (web/worker) image and publishes it to GitHub Container
# Registry, so TrueNAS can deploy by pulling instead of building on the NAS.
#
#   Image: ghcr.io/<owner-lowercased>/<repo-lowercased>   (e.g. ghcr.io/branc9/printforge)
#
# NOTE: the CAD/slicing sandbox images (docker/openscad/**, docker/slicer/**)
# are intentionally NOT published yet. When the CAD and slicing workers go live
# they get their own entries here (e.g. a build matrix with their own
# Dockerfile + image name), because they are independent images.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish web/worker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR rejects uppercase names: bRANC9/PrintForge -> ghcr.io/branc9/printforge
      - name: Compute lowercased image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/django/Dockerfile
          # TrueNAS SCALE 25.10 is amd64. Multi-arch (linux/arm64) can be added
          # later with QEMU + a platforms list, but is intentionally not enabled.
          platforms: linux/amd64
          push: true
          # Keep a plain single-platform manifest: provenance attestations add an
          # extra OCI index entry that can make Watchtower's digest comparison
          # report a perpetual "update available" on the NAS.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
