name: Release

# Builds and publishes the PrintForge images to GitHub Container Registry so
# TrueNAS can deploy by pulling instead of building on the NAS.
#
#   App (web/worker): ghcr.io/<owner>/printforge
#   OpenSCAD sandbox: ghcr.io/<owner>/printforge-openscad
#   Slicer sandbox:   ghcr.io/<owner>/printforge-prusaslicer
#   Orca sandbox:     ghcr.io/<owner>/printforge-orcaslicer
#
# The sandbox images are independent of the app image. Watchtower only tracks the
# app image (the compose `web`/`worker` services); the sandbox images are pulled
# on demand by the worker and rebuilt here on every push/tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish web/worker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR rejects uppercase names: bRANC9/PrintForge -> ghcr.io/branc9/printforge
      - name: Compute lowercased image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/django/Dockerfile
          # TrueNAS SCALE 25.10 is amd64. Multi-arch (linux/arm64) can be added
          # later with QEMU + a platforms list, but is intentionally not enabled.
          platforms: linux/amd64
          push: true
          # Keep a plain single-platform manifest: provenance attestations add an
          # extra OCI index entry that can make Watchtower's digest comparison
          # report a perpetual "update available" on the NAS.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sandbox:
    name: Publish sandbox image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: printforge-openscad
            context: docker/openscad
            file: docker/openscad/Dockerfile
          - name: printforge-prusaslicer
            context: docker/slicer
            file: docker/slicer/Dockerfile
          - name: printforge-orcaslicer
            context: docker/slicer-orca
            file: docker/slicer-orca/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same lowercasing as the app job; the image is ghcr.io/<owner>/<matrix.name>.
      - name: Compute lowercased owner
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # Same reasoning as the app image: no attestation index entries.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache scopes so the matrix legs do not clobber each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
