# ===========================================================================
# PrintForge - TrueNAS SCALE 25.10 "Custom App" (paste this YAML into the UI)
# ===========================================================================
# EDIT (one place each):
#   1. POSTGRES_PASSWORD    (db)  -> strong password
#   2. DJANGO_SECRET_KEY    (web) -> python3 -c "import secrets;print(secrets.token_urlsafe(64))"
#   3. DJANGO_ALLOWED_HOSTS (web) -> NAS hostname / IP
#   4. OLLAMA_BASE_URL      (web) -> Ollama host (default: the Docker host)
#   5. /mnt/<POOL>/... paths      -> your pool dataset
#
# After install, set on the Settings page: CAD mod = docker, Slicing mod = docker
#
# pgvector "vector" extension comes from the Django migration (no init SQL mount).
# Watchtower (already on the host) updates these containers; do NOT add one here.
# Internal Ollama is an optional commented block at the bottom.

services:
  db:
    image: pgvector/pgvector:pg16
    environment: &db-env
      POSTGRES_DB: printforge
      POSTGRES_USER: printforge
      # EDIT: a strong password (web/worker get it through the anchor)
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      # EDIT: absolute path on your pool
      - /mnt/<POOL>/apps/printforge/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printforge -d printforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # EDIT: absolute path on your pool
      - /mnt/<POOL>/apps/printforge/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: ghcr.io/branc9/printforge:latest
    command: ["/app/docker/django/entrypoint.sh", "web"]
    environment: &app-env
      <<: *db-env
      # EDIT: long random string (see the header for the generator command)
      DJANGO_SECRET_KEY: CHANGE_ME
      # EDIT: your NAS hostname / IP (keep localhost for local checks)
      DJANGO_ALLOWED_HOSTS: CHANGE_ME,localhost
      # EDIT: the Ollama host. Default reaches Ollama on the Docker host; if
      # Ollama runs on another machine, put its address here. For an internal
      # Ollama container use http://ollama:11434 (see the block at the bottom).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # EDIT: the Ollama model used for generation. "worker" inherits this
      # through the anchor (all LLM calls run in the Celery worker).
      OLLAMA_MODEL: qwen3-coder:30b
      # EDIT (optional): a vision-capable model (e.g. llava:7b, qwen2.5-vl:7b)
      # used only by the agent self-check review. Leave empty to use OLLAMA_MODEL.
      OLLAMA_VISION_MODEL: ""
      MEDIA_ROOT: /data/media
    # Resolve the Docker host by name on Linux (TrueNAS); used by OLLAMA_BASE_URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # EDIT: absolute path on your pool
      - /mnt/<POOL>/apps/printforge/media:/data/media
    ports:
      # EDIT: host port (left) if 8080 is taken; container port stays 8000
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  worker:
    image: ghcr.io/branc9/printforge:latest
    command: ["/app/docker/django/entrypoint.sh", "worker"]
    environment:
      <<: *app-env
      # EDIT: scratch dir for Docker-out-of-Docker jobs; must be the SAME
      # absolute path as the volume below (see docs/truenas-deploy.md)
      TMPDIR: /mnt/<POOL>/apps/printforge/scratch
    # Resolve the Docker host by name on Linux (TrueNAS); used by OLLAMA_BASE_URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # EDIT: absolute path on your pool
      - /mnt/<POOL>/apps/printforge/media:/data/media
      # EDIT: scratch dir mounted at the IDENTICAL absolute path (host == container)
      - /mnt/<POOL>/apps/printforge/scratch:/mnt/<POOL>/apps/printforge/scratch
      # SECURITY: mounting the Docker socket gives this container control of the
      # host Docker daemon (Docker-out-of-Docker). It is REQUIRED so the CAD/slicer
      # workers can launch ephemeral sandbox containers, and it is the main
      # security trade-off of this deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

# ===========================================================================
# OPTIONAL: internal Ollama (only if it runs on this NAS). To enable: delete the
# leading "# " below and change OLLAMA_BASE_URL in the web environment above to
# http://ollama:11434 (worker inherits it). For an NVIDIA GPU also uncomment the
# deploy block.
# ===========================================================================
